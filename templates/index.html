<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FWI Prediction System</title>
  <link rel="stylesheet" href="/static/style1.css">
</head>
<body>

  <!-- Floating Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="hero glass-panel">
    <div class="badge">🔥 Fire Weather Intelligence</div>

    <h1>Forest Fire<br><span>Prediction Engine</span></h1>

    <div class="divider"></div>

    <p class="subtitle">
      Enter weather and environmental parameters to instantly predict the
      Fire Weather Index. Powered by Machine Learning for accurate, real-time risk assessment.
    </p>

    <div class="btn-group">
      <a href="/predictdata" class="btn-primary">
        <span class="btn-icon">⚡</span> Get Prediction
      </a>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="icon-wrap">🎯</div>
        <div class="number">98%</div>
        <div class="label">Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="icon-wrap">⚙️</div>
        <div class="number">9</div>
        <div class="label">Parameters</div>
      </div>
      <div class="stat-card">
        <div class="icon-wrap">🌍</div>
        <div class="number">2</div>
        <div class="label">Regions</div>
      </div>
      <div class="stat-card">
        <div class="icon-wrap">⚡</div>
        <div class="number">Real</div>
        <div class="label">Time Results</div>
      </div>
    </div>
  </div>

</body>
</html>
